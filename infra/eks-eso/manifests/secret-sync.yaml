apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: review-db
  namespace: platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      # Pod Identity uses the operator Pod's default credential chain.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: review-db
  namespace: platform
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: review-db
    kind: SecretStore
  target:
    name: review-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: "__RDS_SECRET_ARN__"
        property: username
    - secretKey: password
      remoteRef:
        key: "__RDS_SECRET_ARN__"
        property: password
